name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
template: |
  ## What's Changed

  $CHANGES

categories:
  - title: 'Module'
    labels: [module]
  - title: 'Examples'
    labels: [examples]
  - title: 'Documentation'
    labels: [documentation]
  - title: 'Dependencies'
    labels: [dependencies, github_actions]
  - title: 'Other Changes'
    labels: []

version-resolver:
  major:
    labels: [major]
  minor:
    labels: [minor, enhancement]
  patch:
    labels: [patch, bug]
  default: patch
