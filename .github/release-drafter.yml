name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
template: |
  ## What's Changed

  $CHANGES

categories:
  - title: 'Module'
    labels: [module]
  - title: 'Examples'
    labels: [examples]
  - title: 'Documentation'
    labels: [documentation]
  - title: 'Dependencies'
    labels: [dependencies, github_actions]
  - title: 'Other Changes'
    labels: []

version-resolver:
  major:
    labels: [major]
  minor:
    labels: [minor, enhancement]
  patch:
    labels: [patch, bug]
  default: patch

# Labels each pull request with its version bump from its conventional-commit
# title (the Labeler workflow runs this): breaking changes (`type!:` or a
# BREAKING CHANGE note) are major, features minor, everything else patch.
autolabeler:
  - label: major
    title:
      - '/^[a-z]+(\([^)]*\))?!:/'
    body:
      - '/BREAKING CHANGE/'
  - label: minor
    title:
      - '/^feat(\([^)]*\))?:/'
  - label: patch
    title:
      - '/^(fix|perf|refactor|revert|docs|chore|ci|build|style|test)(\([^)]*\))?:/'
