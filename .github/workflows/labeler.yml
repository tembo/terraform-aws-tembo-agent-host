name: Labeler

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Reads changed paths through the API; never checks out the pull request.
      - name: Apply labels from changed paths
        uses: actions/labeler@v6
        with:
          sync-labels: true

      # Release Drafter's autolabeler: major, minor or patch from the title
      # (.github/release-drafter.yml), which the next release's version follows.
      - name: Apply the version label from the title
        uses: release-drafter/release-drafter@v6
        with:
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
