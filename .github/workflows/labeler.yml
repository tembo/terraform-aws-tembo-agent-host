name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Reads changed paths through the API; never checks out the pull request.
      - name: Apply labels from changed paths
        uses: actions/labeler@v6
        with:
          sync-labels: true
