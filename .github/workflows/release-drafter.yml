name: Release Drafter

# Drafts the next release from merged pull requests. Publishing the draft tags
# it, and the Terraform Registry picks up the tag.
on:
  push:
    branches:
      - main

concurrency:
  group: release-drafter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
