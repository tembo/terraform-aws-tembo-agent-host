name: Release Drafter

# Publishes the next release on every merge, versioned by the merged pull
# requests' major, minor or patch labels. The release tags the commit, and the
# Terraform Registry picks up the tag. A pull request labelled no-release
# (documentation and CI changes) waits in the draft for the next release.
on:
  push:
    branches:
      - main

concurrency:
  group: release-drafter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: cloudposse/github-action-auto-release@8f9b7192d095af697c5900235e4aecf930663f28 # v4.0.1
        with:
          # Required: the action's duplicate check templates it into a script,
          # and the empty default doesn't parse.
          prerelease: false
          publish: true
          config-name: release-drafter.yml
