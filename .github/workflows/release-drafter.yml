name: Release Drafter

# Publishes the next release on every merge, versioned by the merged pull
# requests' major, minor or patch labels. The release tags the commit, and the
# Terraform Registry picks up the tag. A pull request labelled no-release
# (documentation and CI changes) only updates the draft, and goes out with the
# next release.
on:
  push:
    branches:
      - main

concurrency:
  group: release-drafter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check for no-release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[]?.name')"
          if grep -qx no-release <<<"$labels"; then
            echo "The merged pull request is labelled no-release: updating the draft only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: release-drafter/release-drafter@v6
        with:
          publish: ${{ steps.release.outputs.publish }}
          commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
