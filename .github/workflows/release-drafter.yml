name: Release Drafter

# Publishes the next release on every merge, versioned by the merged pull
# requests' major, minor or patch labels. The release tags the commit, and the
# Terraform Registry picks up the tag.
on:
  push:
    branches:
      - main

concurrency:
  group: release-drafter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          publish: true
          commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
