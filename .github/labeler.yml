module:
  - changed-files:
      - any-glob-to-any-file:
          - '*.tf'

examples:
  - changed-files:
      - any-glob-to-any-file:
          - examples/**

tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**
          - test/**

documentation:
  - all:
      - changed-files:
          - all-globs-to-all-files:
              - '**/*.md'

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/labeler.yml
          - .github/release-drafter.yml
