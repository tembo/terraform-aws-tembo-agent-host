version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /
      - /examples/complete
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /test/src
    schedule:
      interval: weekly
    groups:
      terratest:
        patterns: ['*']
